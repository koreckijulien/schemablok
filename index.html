<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="description" content="Schemablok, application web installable.">
        <link rel="manifest" href="./manifest.webmanifest">
        <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
        <title>Schemablok</title>
    </head>
    <body>
        <main>
            <h1>Schemablok</h1>
            <p>Application en cours de construction.</p>
        </main>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("./service-worker.js")
                        .catch(error => console.error("Impossible d’enregistrer le service worker.", error));
                });
            }
        </script>
    </body>
</html>
